name: Unzip Site Archive

on:
  push:
    paths:
      - 'dousette.org.zip'

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clear old files/folders, extract zip, and restore core config
        run: |
          # 1. Move the zip out of the workspace to /tmp
          mv dousette.org.zip /tmp/dousette.org.zip

          # 2. Delete all root files and subdirectories (preserves .git and .github)
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' -exec rm -rf {} +

          # 3. Extract to a temporary folder to check and normalize hierarchy
          mkdir /tmp/staging
          unzip -o /tmp/dousette.org.zip -d /tmp/staging

          # Enable dotglob so hidden files (if any exist) are caught when moving
          shopt -s dotglob

          # Check if there is only one item inside the zip and if it's a directory
          ITEMS=(/tmp/staging/*)
          if [ ${#ITEMS[@]} -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            echo "Single parent folder detected inside ZIP (${ITEMS[0]}). Flattening to root..."
            mv "${ITEMS[0]}"/* ./
          else
            echo "Direct root-level files detected inside ZIP. Copying directly to root..."
            mv /tmp/staging/* ./
          fi

          # 4. Guarantee critical GitHub Pages files always exist
          echo "dousette.org" > CNAME
          touch .nojekyll

          # 5. Clean up temporary extraction directories and zip files
          rm -rf /tmp/staging
          rm -f /tmp/dousette.org.zip

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage all changes (including deletions)
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto-unpack and sync dousette.org.zip"
          git push
